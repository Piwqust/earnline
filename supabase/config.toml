[functions.earnline-sync]
# Browser sessions send a Supabase bearer token. The function validates it
# again before resolving the caller's membership with its service client.
verify_jwt = true

[functions.earnline-pair-device]
# A valid, short-lived, one-use pairing token is the authorization. The
# function creates a device-scoped Auth identity only after validating it.
verify_jwt = false
