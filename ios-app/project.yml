name: earnline
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.1
options:
  bundleIdPrefix: com.earnline
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
fileGroups:
  - TestPlans
settings:
  base:
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
    Release:
      CODE_SIGNING_ALLOWED: "YES"
      CODE_SIGNING_REQUIRED: "YES"
      CODE_SIGN_STYLE: Automatic
targets:
  earnline:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    sources:
      - path: earnline
    preBuildScripts:
      - name: Reset Dev companion build marker
        script: |
          rm -f "${PROJECT_TEMP_DIR}/earnline-dev-ready-to-install"
        basedOnDependencyAnalysis: false
        showEnvVars: false
      # Production settings are injected by the signed archive/CI environment
      # and must never fall back to the literal Info.plist placeholders. Fail
      # the Release build before it can produce an unusable authenticated app.
      - name: Validate Release Supabase configuration
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            bash "${PROJECT_DIR}/Scripts/validate-release-supabase-config.sh"
          fi
        basedOnDependencyAnalysis: false
        showEnvVars: false
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnline.app
        PRODUCT_DISPLAY_NAME: earnline
        # The primary app must be signed for a physical-device Debug run. The
        # local Xcode account/team remains in ignored Local.private.xcconfig.
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: earnline/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_ASSET_PATHS: ""
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: earnline/Resources/earnline.entitlements
  # A separate, side-by-side installable build for testing: same sources, its
  # own bundle ID and home-screen name, and the full in-app debug menu
  # compiled in via the DEBUGMENU condition. The App Store target never
  # contains any DEBUGMENU code.
  earnline-dev:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    sources:
      - path: earnline
    dependencies:
      # Keep the marker ordering deterministic: the production target clears
      # it first, then the Dev target sets it only when this build action
      # actually included the companion.
      - target: earnline
        link: false
        embed: false
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnline.app.dev
        PRODUCT_NAME: earnline-dev
        PRODUCT_DISPLAY_NAME: earnline Dev
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: earnline/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: earnline Dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_ASSET_PATHS: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUGMENU"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: earnline/Resources/earnline.entitlements
    postBuildScripts:
      - name: Mark Dev companion ready to install
        script: |
          : > "${PROJECT_TEMP_DIR}/earnline-dev-ready-to-install"
        basedOnDependencyAnalysis: false
        showEnvVars: false
  earnlineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: earnlineTests
    dependencies:
      - target: earnline
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnline.tests
        GENERATE_INFOPLIST_FILE: "YES"
  earnlineUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: earnlineUITests
    dependencies:
      - target: earnline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnline.uitests
        GENERATE_INFOPLIST_FILE: "YES"
  earnlineDevUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: earnlineDevUITests
    dependencies:
      - target: earnline-dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnline.devuitests
        GENERATE_INFOPLIST_FILE: "YES"
  earnlineReleaseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: earnlineReleaseUITests
    dependencies:
      - target: earnline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnline.releaseuitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  # Local physical-device workflow. It builds only the primary app so a
  # personal signing team can provision the connected phone without also
  # provisioning the side-by-side Dev companion.
  earnline-device:
    build:
      targets:
        earnline: all
    run:
      config: Debug
  earnline:
    build:
      targets:
        earnline: all
        # Build the companion only for local Debug build/run actions. It is
        # deliberately absent from test, archive, and CI actions.
        earnline-dev: [run]
        earnlineTests: [test]
        earnlineUITests: [test]
      postActions:
        - name: Install earnline Dev companion
          settingsTarget: earnline-dev
          script: |
            "${PROJECT_DIR}/Scripts/install-dev-companion.sh"
    test:
      # Everyday is deliberately the default. AppStoreRelease is the broad
      # Debug coverage plan with the rarely needed accessibility-size checks.
      # It is not Release-binary evidence; `earnline-release` below supplies
      # the separate Release test action.
      testPlans:
        - path: TestPlans/Everyday.xctestplan
          defaultPlan: true
        - path: TestPlans/AppStoreRelease.xctestplan
  # Production-binary gate. Keep it separate from the normal scheme because
  # Xcode stores one build configuration per TestAction, not per test plan.
  # This scheme compiles and launches the actual Release app, with no Debug
  # automation hooks available to it.
  earnline-release:
    build:
      targets:
        earnline: all
        earnlineReleaseUITests: [test]
    test:
      config: Release
      targets:
        - earnlineReleaseUITests
  earnline-dev:
    build:
      targets:
        earnline-dev: all
    run:
      config: Debug
    test:
      targets:
        - earnlineDevUITests
