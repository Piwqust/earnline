# Tuned to the code as it is written today, not the other way round: this config
# exists to stop new problems, never to demand a reformat of working files.
# Tighten a threshold only alongside the change that brings a file under it.

included:
  - earnline
  - earnlineTests
  - earnlineUITests
  - earnlineDevUITests
  - earnlineReleaseUITests

excluded:
  - .derived-data
  - build
  - earnline.xcodeproj

disabled_rules:
  # Multi-line collection literals carry trailing commas throughout this
  # codebase — a deliberate choice that keeps diffs to one line per element.
  # SwiftLint's default forbids them; the house style wins.
  - trailing_comma
  # `var x: T? = nil` is used consistently and reads better next to the
  # non-optional stored properties around it.
  - implicit_optional_initialization
  # `.sheet(item:) { } content: { }` and friends are the SwiftUI idiom.
  - multiple_closures_with_trailing_closure
  # `String(decoding:as:)` is deliberate: it cannot fail, where the "preferred"
  # failable initializer would force an optional dance around request bodies
  # that are already known-valid UTF-8.
  - optional_data_string_conversion
  # This codebase deliberately carries long explanatory comments above tricky
  # logic — the sync conflict rules, the appearance override, the lock window.
  # That is a feature of the house style.
  - todo
  # SwiftUI view bodies are legitimately deep; nesting depth here measures the
  # view tree, not control flow.
  - type_body_length
  - file_length

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

line_length:
  # The longest existing line is 229 characters (a localized error string).
  # Warn above a comfortable reading width; never fail the build on prose.
  warning: 140
  error: 260
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 90
  # `SyncCoordinator.pullRemoteRows` is 248 lines of five near-identical merge
  # loops. Splitting it is a real refactor with real risk; flagged as a warning
  # until someone takes it on deliberately.
  error: 300

function_parameter_count:
  warning: 8
  error: 12

cyclomatic_complexity:
  warning: 15
  # Same function as above: the complexity is one `guard` per malformed-field
  # check, which is the point of that code rather than a defect in it.
  error: 40

large_tuple:
  warning: 3
  # One 4-member tuple exists (ClientBadgeModelView). Warn, don't block.
  error: 6

nesting:
  type_level: 3

identifier_name:
  # Short names are idiomatic in the small pure helpers (`a`/`b` comparators,
  # `s` for a working string in the parser).
  min_length:
    warning: 1
  excluded: [id, a, b, s, e, h, m, r, x, y]

type_name:
  min_length: 3
  # `earnlineApp` is the @main entry point, lowercase to match the product name.
  excluded: [ID, earnlineApp]
