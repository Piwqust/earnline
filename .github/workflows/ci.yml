name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IOS_SIMULATOR_NAME: "iPhone 17"
  # Xcode 27 preview runners can lose SimMetalHost during long UI suites.
  # The app swaps only its procedural RealityKit medals for semantic symbols;
  # local UI tests and production builds continue to render the real 3D view.
  EARNLINE_DISABLE_3D_FOR_UI_TESTS: "1"

jobs:
  ios-project:
    name: iOS project generation
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate and reject drift
        run: |
          xcodegen generate
          git diff --exit-code -- earnline.xcodeproj

  ios-lint:
    name: iOS lint
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - name: Install the audited SwiftLint version
        run: |
          brew install mint
          mint run realm/SwiftLint@0.65.0 swiftlint lint --reporter github-actions-logging

  ios-unit:
    name: iOS unit tests (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: "26.4.1"
            runtime_label: "26.4"
            runner: macos-26
            xcode: "26.4.1"
            setup_xcode: true
          - runtime: "27.0"
            runtime_label: "27.0"
            runner: xcode-27
            setup_xcode: false
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - if: matrix.setup_xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Confirm Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Require the pinned simulator runtime
        run: xcrun simctl list runtimes | grep -F "iOS ${{ matrix.runtime_label }}"
      - name: Check Release configuration gate
        run: python3 Scripts/test-release-supabase-config.py
      - name: Run unit tests
        run: |
          xcodebuild \
            -scheme earnline \
            -destination 'platform=iOS Simulator,name=${{ env.IOS_SIMULATOR_NAME }},OS=${{ matrix.runtime }}' \
            -only-testing:earnlineTests \
            -resultBundlePath unit-${{ matrix.runtime }}.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-${{ matrix.runtime }}-xcresult
          path: ios-app/unit-${{ matrix.runtime }}.xcresult
          retention-days: 7

  ios-production-ui:
    name: iOS production UI (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: "26.4.1"
            runtime_label: "26.4"
            runner: macos-26
            xcode: "26.4.1"
            setup_xcode: true
            retry_flags: ""
          - runtime: "27.0"
            runtime_label: "27.0"
            runner: xcode-27
            setup_xcode: false
            retry_flags: "-test-iterations 2 -retry-tests-on-failure -test-repetition-relaunch-enabled YES"
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - if: matrix.setup_xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Confirm Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Require the pinned simulator runtime
        run: xcrun simctl list runtimes | grep -F "iOS ${{ matrix.runtime_label }}"
      - name: Run production UI tests
        run: |
          xcodebuild \
            -scheme earnline \
            -destination 'platform=iOS Simulator,name=${{ env.IOS_SIMULATOR_NAME }},OS=${{ matrix.runtime }}' \
            -only-testing:earnlineUITests \
            -collect-test-diagnostics never \
            ${{ matrix.retry_flags }} \
            -resultBundlePath production-ui-${{ matrix.runtime }}.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-production-ui-${{ matrix.runtime }}-xcresult
          path: ios-app/production-ui-${{ matrix.runtime }}.xcresult
          retention-days: 7

  ios-dev-ui:
    name: iOS Dev companion UI
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Require the iOS 27 baseline runtime
        run: xcrun simctl list runtimes | grep -F "iOS 27.0"
      - name: Run Dev companion UI tests
        run: |
          xcodebuild \
            -scheme earnline-dev \
            -destination 'platform=iOS Simulator,name=${{ env.IOS_SIMULATOR_NAME }},OS=27.0' \
            -only-testing:earnlineDevUITests \
            -test-iterations 2 \
            -retry-tests-on-failure \
            -test-repetition-relaunch-enabled YES \
            -resultBundlePath dev-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-ui-xcresult
          path: ios-app/dev-ui.xcresult
          retention-days: 7

  ios-app-store-release-plan:
    name: iOS App Store accessibility coverage (26.4.1)
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"
      - name: Confirm Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Require the pinned simulator runtime
        run: xcrun simctl list runtimes | grep -F "iOS 26.4"
      - name: Run the explicit App Store release plan
        run: |
          xcodebuild \
            -scheme earnline \
            -testPlan AppStoreRelease \
            -destination 'platform=iOS Simulator,name=${{ env.IOS_SIMULATOR_NAME }},OS=26.4.1' \
            -only-testing:earnlineUITests/EarnlineUITests/testFiltersRemainReachableAtAccessibilityTextSize \
            -collect-test-diagnostics never \
            -resultBundlePath app-store-release.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-store-release-xcresult
          path: ios-app/app-store-release.xcresult
          retention-days: 7

  ios-release-build:
    name: iOS Release binary build and guard
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build the true Release binary and reject test hooks
        env:
          EARNLINE_SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_URL }}
          EARNLINE_SUPABASE_PRODUCTION_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EARNLINE_PRIVACY_POLICY_URL: https://github.com/Piwqust/earnline/blob/main/PRIVACY.md
        run: |
          set -euo pipefail
          derived_data="$PWD/.ci-derived-data"
          xcodebuild \
            -scheme earnline-release \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=${{ env.IOS_SIMULATOR_NAME }},OS=27.0' \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          binary="$(find "$derived_data/Build/Products" -path '*Release-iphonesimulator/earnline.app/earnline' -print -quit)"
          test -n "$binary"
          if /usr/bin/strings "$binary" | grep -E -- '-uiTesting|-authGatePreview|-uiTestDarkAppearance|-demoInsights|-disable3DForUITests'; then
            echo 'Release binary contains UI-automation launch hooks.' >&2
            exit 1
          fi

  web:
    name: Web (lint, test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  backend-static:
    name: Supabase contract and edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Verify project-symbol contract
        run: node scripts/verify-project-symbol-contract.mjs
      - name: Typecheck and lint edge functions
        working-directory: supabase/functions
        run: |
          deno check earnline-sync/index.ts earnline-pair-device/index.ts
          deno lint earnline-sync/index.ts earnline-pair-device/index.ts
      - name: Check operator scripts
        run: |
          node --check scripts/backup-supabase-rest.mjs
          node --check scripts/backup-supabase-control-plane.mjs
          node --check scripts/verify-supabase-backup-restore.mjs
          node --check scripts/verify-supabase-security.mjs
          node --check scripts/verify-supabase-e2e.mjs

  ios-sync-sql:
    name: iOS atomic sync and combined reads
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 55547:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify real concurrent writes and read isolation
        env:
          PGUSER: postgres
          PGPASSWORD: local_ci_only
        run: python3 scripts/test-ios-atomic-sync.py 55547

  backend-migrations-from-zero:
    name: Supabase migrations from zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a clean local Supabase stack
        working-directory: supabase
        run: supabase start -x studio,imgproxy,logflare,vector
      - name: Reapply every migration from zero
        working-directory: supabase
        run: supabase db reset --local
      - name: Stop the local stack
        if: always()
        working-directory: supabase
        run: supabase stop --no-backup

  staging-e2e:
    name: Staging security and owner/device E2E
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify staging security contract
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_OWNER_ACCESS_TOKEN: ${{ secrets.SUPABASE_OWNER_ACCESS_TOKEN }}
        run: node scripts/verify-supabase-security.mjs
      - name: Verify staging owner and paired-device lifecycle
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/verify-supabase-e2e.mjs
