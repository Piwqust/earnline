name: earnline
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.48.0
options:
  bundleIdPrefix: com.earnline
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
    Release:
      CODE_SIGNING_ALLOWED: "YES"
      CODE_SIGNING_REQUIRED: "YES"
      CODE_SIGN_STYLE: Automatic
targets:
  earnline:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Local.xcconfig
    sources:
      - path: earnline
    entitlements:
      path: earnline/Resources/earnline.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnline.app
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: earnline/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_ASSET_PATHS: ""
  # A separate, side-by-side installable build for testing: same sources, its
  # own bundle ID and home-screen name, and the full in-app debug menu
  # compiled in via the DEBUGMENU condition. The App Store target never
  # contains any DEBUGMENU code.
  earnline-dev:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Local.xcconfig
    sources:
      - path: earnline
    entitlements:
      path: earnline/Resources/earnline.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnline.app.dev
        PRODUCT_NAME: earnline-dev
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: earnline/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: earnline Dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_ASSET_PATHS: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUGMENU"
  earnlineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: earnlineTests
    dependencies:
      - target: earnline
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnline.tests
        GENERATE_INFOPLIST_FILE: "YES"
  earnlineUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: earnlineUITests
    dependencies:
      - target: earnline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnline.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  earnline:
    build:
      targets:
        earnline: all
        earnlineTests: [test]
        earnlineUITests: [test]
    test:
      targets:
        - earnlineTests
        - earnlineUITests
  earnline-dev:
    build:
      targets:
        earnline-dev: all
    run:
      config: Debug
